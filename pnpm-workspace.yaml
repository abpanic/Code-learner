# pnpm 11 reads settings from here rather than the "pnpm" field in package.json.
# unrs-resolver ships a native binding used by eslint-config-next's import
# resolver, so its install script has to be allowed to run. Only `pnpm lint`
# needs it -- `next build` does not run ESLint -- so a deploy is unaffected.
allowBuilds:
  unrs-resolver: true
